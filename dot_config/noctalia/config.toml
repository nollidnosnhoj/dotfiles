[backdrop]
enabled = true

[bar.main]
start = [ "workspaces", "media" ]
center = [ "clock", "active_window" ]
end = [ "tray", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "notifications" ]
layer = "overlay"
margin_edge = 5
padding = 18
radius = 10
smart_auto_hide = true

[calendar]
enabled = true

[control_center.calendar]
show_week_numbers = true

[hooks]
colors_changed = "update-noctalia-config"

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true

[nightlight]
enabled = true

[shell]
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

[theme]
builtin = "Tokyo-Night"

[theme.templates]
builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "ghostty", "hyprland", "kitty", "niri", "qt", "starship" ]
community_ids = [ "opencode", "pi-agent", "zen-browser", "obsidian", "zed", "papirus-icons", "bat", "lazygit", "yazi" ]

[wallpaper]
per_monitor_directories = true

[wallpaper.automation]
enabled = true
recursive = false

[widget.clock]
format = "{:%A} {:%H:%M}"

[widget.network]
show_label = false

[widget.workspaces]
show_labels = false
